name: Verify MCLauncher package

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - packages/mclauncher.nix
      - home/mclauncher.nix
      - .github/workflows/mclauncher.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - packages/mclauncher.nix
      - home/mclauncher.nix
      - .github/workflows/mclauncher.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out flake
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build MCLauncher
        run: nix build .#mclauncher --print-build-logs
